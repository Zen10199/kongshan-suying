# 推 main：自动编译验证（不发布）
# 打 tag（v 开头，如 v1.0.0）：编译并发布 .cskin 到 Release
# 也可在 Actions 页面手动触发（Run workflow 按钮）
name: Build and release skin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jsonnet
        run: brew install jsonnet

      - name: Compile skin
        # 紧凑输出，适合发布；产物写入仓库根目录（已被 .gitignore 忽略）
        run: jsonnet -S -m . ./jsonnet/main.jsonnet

      - name: Pack cskin
        # 元书导入时把 zip 直接解压到 Skins/，皮肤名取自 zip 内的顶层目录名，
        # 所以包内必须有一层「空山素影」目录，否则内容会平铺在 Skins/ 根下
        # 用 python 打包：zip 命令不给中文文件名设 UTF-8 标志，解压会乱码
        run: |
          mkdir "空山素影"
          mv config.yaml demo.png jsonnet light dark README.md "空山素影/"
          if [ -d sound ]; then cp -R sound "空山素影/"; fi
          python3 -c "
          import os, zipfile
          with zipfile.ZipFile('空山素影.cskin', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('空山素影'):
                  for f in sorted(files):
                      if f == '.DS_Store':
                          continue
                      p = os.path.join(root, f)
                      z.write(p, p)
          "

      # 每次构建都在运行页面留存可下载的产物（保留 90 天）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kongshan-suying-${{ github.ref_name }}
          path: '*.cskin'

      - name: Create release and upload
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "空山素影.cskin" \
          || gh release upload "$GITHUB_REF_NAME" \
            "空山素影.cskin" --clobber
