# 打 tag（v 开头，如 v1.0.0）时自动编译皮肤并发布 .cskin 到 Release
name: Build and release skin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jsonnet
        run: brew install jsonnet

      - name: Compile skin
        # 紧凑输出，适合发布；产物写入仓库根目录（已被 .gitignore 忽略）
        run: jsonnet -S -m . ./jsonnet/main.jsonnet

      - name: Pack cskin
        run: |
          zip -r "kongshan-suying-${GITHUB_REF_NAME}.cskin" \
            config.yaml light dark README.md

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "kongshan-suying-${GITHUB_REF_NAME}.cskin" \
          || gh release upload "$GITHUB_REF_NAME" \
            "kongshan-suying-${GITHUB_REF_NAME}.cskin" --clobber
